<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Movieholix — yakında</title>
    <meta
      name="description"
      content="Movieholix, film zevkin üzerinden insanlarla tanıştığın bir sinema uygulaması. Yakında."
    />
    <meta name="theme-color" content="#1B2440" />
    <meta property="og:title" content="Movieholix" />
    <meta
      property="og:description"
      content="Film zevkin üzerinden tanış. Yakında."
    />
    <meta property="og:type" content="website" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231B2440'/%3E%3Ccircle cx='16' cy='16' r='7.5' fill='none' stroke='%23FFC23D' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23F2547D'/%3E%3C/svg%3E"
    />
    <style>
      /* Renkler packages/tokens/src/raw.cjs ile aynı (PRD 15.2 "Gece seansı"). */
      :root {
        --ink: #1b2440;
        --surface1: #252f52;
        --screen: #f4f7fb;
        --reel: #17736e;
        --ticket: #f2547d;
        --popcorn: #ffc23d;
        --celluloid: #6e7689;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        background:
          radial-gradient(
            ellipse 80% 60% at 50% -10%,
            rgba(242, 84, 125, 0.16),
            transparent 70%
          ),
          var(--ink);
        color: var(--screen);
        font: 400 1rem/1.45 "Hanken Grotesk", ui-sans-serif, system-ui,
          -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 34rem;
        text-align: center;
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 1.75rem;
        display: block;
      }
      h1 {
        margin: 0 0 0.6rem;
        font-size: clamp(2.25rem, 9vw, 3.5rem);
        line-height: 1.05;
        letter-spacing: -0.02em;
        font-weight: 800;
      }
      .tagline {
        margin: 0 auto 2.25rem;
        max-width: 26rem;
        font-size: clamp(1.05rem, 3.5vw, 1.25rem);
        color: var(--screen);
        opacity: 0.86;
      }
      .badge {
        display: inline-block;
        margin-bottom: 2rem;
        padding: 0.4rem 0.9rem;
        border: 1px solid rgba(244, 247, 251, 0.22);
        border-radius: 999px;
        background: var(--surface1);
        font-size: 0.8125rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--popcorn);
      }
      .en {
        margin: 2.5rem auto 0;
        padding-top: 1.75rem;
        border-top: 1px solid rgba(244, 247, 251, 0.14);
        max-width: 26rem;
        font-size: 0.9375rem;
        opacity: 0.72;
      }
      .en strong {
        color: var(--popcorn);
        font-weight: 600;
      }
      footer {
        margin-top: 2.5rem;
        font-size: 0.8125rem;
        opacity: 0.6;
      }
      footer a {
        color: var(--popcorn);
      }
      @media (prefers-reduced-motion: no-preference) {
        main {
          animation: rise 0.5s ease-out both;
        }
        @keyframes rise {
          from {
            opacity: 0;
            transform: translateY(10px);
          }
        }
      }
    </style>
  </head>
  <body>
    <main>
      <svg
        class="mark"
        viewBox="0 0 32 32"
        role="img"
        aria-label="Movieholix logosu"
      >
        <rect width="32" height="32" rx="7" fill="#252F52" />
        <circle
          cx="16"
          cy="16"
          r="7.5"
          fill="none"
          stroke="#FFC23D"
          stroke-width="2.5"
        />
        <circle cx="16" cy="16" r="2" fill="#F2547D" />
      </svg>

      <span class="badge">Yakında</span>

      <h1>Movieholix</h1>
      <p class="tagline">
        Jenerikten sonra da konuşacak birini bul. Film zevkin üzerinden
        tanışman için yeni bir uygulama.
      </p>

      <p class="en">
        <strong>Coming soon.</strong> Movieholix is a new app for meeting people
        through your taste in film.
      </p>

      <footer>
        Bize ulaş:
        <a href="mailto:destek@movieholix.app">destek@movieholix.app</a>
      </footer>
    </main>
  </body>
</html>
