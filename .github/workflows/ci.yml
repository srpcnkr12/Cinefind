name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  PNPM_VERSION: "12.4.1"
  NODE_VERSION: "22"

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Lint scripts (supabase/)
        run: pnpm lint:scripts

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # Web build'i ayrı tutuyoruz: `next build` katalog sayfalarını ön-render
  # ederken Supabase'e gerçekten bağlanıyor ve erişemezse build'i hata vererek
  # durduruyor. Bu istenen davranış (boş sayfa yayınlamaktansa build patlasın),
  # bu yüzden CI'a sahte env vermek yerine gerçek bir veritabanı veriyoruz.
  # pgTAP de aynı örneği kullandığı için Supabase tek kez başlatılıyor.
  database-and-web-build:
    name: Migrations, pgTAP, web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # `supabase db start` yalnızca Postgres'i ayağa kaldırıyor; Kong/REST kapalı
      # kaldığı için web build'in ihtiyaç duyduğu REST API adresi oluşmuyor.
      # Tam yığın gerekiyor (pgTAP da bu örnekle çalışıyor).
      - name: Start local Supabase and apply migrations
        run: supabase start

      - name: Run pgTAP / RLS tests
        run: supabase test db

      # E2E testleri film/koleksiyon listelerinden gezinerek çalışıyor; boş
      # katalogda anlamsızlar. PRD 18.1'in öngördüğü gibi fixture sağlayıcıyla
      # dolduruluyor (gerçek TMDB anahtarı CI'da yok ve olmamalı).
      - name: Seed catalog (fixture)
        run: |
          eval "$(supabase status -o env | grep -E '^[A-Z0-9_]+=' | sed 's/^/export /')"
          : "${API_URL:?supabase status API_URL döndürmedi}"
          : "${SECRET_KEY:?supabase status SECRET_KEY döndürmedi}"
          curl -fsS -X POST "$API_URL/functions/v1/tmdb-sync" \
            -H "apikey: $SECRET_KEY" | tee /dev/stderr | grep -q '"provider":"fixture"'

      - name: Build web
        run: |
          # `status -o env` çıktısında "Stopped services: [...]" gibi bilgi
          # satırları da olabiliyor; yalnızca KEY=VALUE satırlarını alıyoruz.
          eval "$(supabase status -o env | grep -E '^[A-Z0-9_]+=' | sed 's/^/export /')"
          : "${API_URL:?supabase status API_URL döndürmedi}"
          : "${ANON_KEY:?supabase status ANON_KEY döndürmedi}"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" \
          NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" \
            pnpm --filter web build

      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install chromium --with-deps

      # Playwright kendi webServer'ında yeniden derliyor (CTA'ların mağaza
      # URL'leri NEXT_PUBLIC_* olduğu için derleme anında gömülmek zorunda).
      - name: Web E2E (Playwright)
        run: |
          eval "$(supabase status -o env | grep -E '^[A-Z0-9_]+=' | sed 's/^/export /')"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" \
          NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" \
            pnpm e2e:web

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
