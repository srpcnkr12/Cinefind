packages:
  - "apps/*"
  - "packages/*"
# Expo/Metro'nun "isolated dependencies" (pnpm varsayılanı) desteği bazı RN paketlerinde
# (ör. react-native-css-interop/jsx-runtime) çözümleme hatası veriyor — Expo'nun resmi
# monorepo dokümanı bu durumda hoisted linki öneriyor. Bkz. docs.expo.dev/guides/monorepos.
nodeLinker: hoisted
allowBuilds:
  "@parcel/watcher": true
  '@sentry/cli': true
  "@swc/core": true
  core-js: true
  esbuild: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - "@expo/cli@57.0.24"
  - "@expo/fingerprint@0.20.13"
  - "@expo/prebuild-config@57.0.16"
  - "@expo/ui@57.0.18"
  - expo-asset@57.0.17
  - expo-constants@57.0.18
  - expo-device@57.0.2
  - expo-file-system@57.0.7
  - expo-font@57.0.4
  - expo-glass-effect@57.0.3
  - expo-image@57.0.5
  - expo-keep-awake@57.0.2
  - expo-linking@57.0.10
  - expo-localization@57.0.2
  - expo-modules-autolinking@57.0.13
  - expo-modules-core@57.0.18
  - expo-router@57.0.21
  - expo-splash-screen@57.0.9
  - expo-symbols@57.0.3
  - expo-system-ui@57.0.4
  - expo-web-browser@57.0.3
  - expo@57.0.22
  - icu-minify@4.14.4
  - next-intl-swc-plugin-extractor@4.14.4
  - next-intl@4.14.4
  - use-intl@4.14.4
  - zod@4.6.2
